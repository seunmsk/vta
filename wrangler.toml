name = "vtaglobal"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

# Storage for the dashboard (content edits, enquiries, comments, uploaded photos).
# Create a KV namespace in Cloudflare (Storage & Databases → KV → Create, name it "vta-data"),
# then paste its ID below and uncomment these three lines.
# [[kv_namespaces]]
# binding = "DATA"
# id = "PASTE_KV_NAMESPACE_ID_HERE"

# The dashboard password is a secret, set in Cloudflare (never in this file):
# Pages project → Settings → Variables and Secrets → Add → Type: Secret, Name: ADMIN_PASSWORD
