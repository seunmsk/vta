<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard | VTA Global Services</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <img src="/assets/img/logo.png" alt="VTA Global Services" height="56">
    <h1>Dashboard</h1>
    <label>Password<input type="password" id="pw" autocomplete="current-password" required></label>
    <button type="submit" class="btn primary">Sign in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <a href="/" class="brand"><img src="/assets/img/logo.png" alt="VTA Global Services" height="40"></a>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="enquiries">Enquiries <span class="pill" id="newCount" hidden></span></button>
      <button type="button" data-tab="comments">Comments <span class="pill" id="openCount" hidden></span></button>
      <button type="button" data-tab="properties">Properties</button>
      <button type="button" data-tab="passports">Passports</button>
      <button type="button" data-tab="faqs">FAQs</button>
      <button type="button" data-tab="settings">Settings</button>
    </nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener">View site ↗</a>
      <button type="button" id="logout" class="link">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="savebar" id="savebar" hidden>
      <span>You have unpublished changes.</span>
      <div><button type="button" class="btn" id="discard">Discard</button><button type="button" class="btn primary" id="publish">Publish changes</button></div>
    </div>
    <div class="banner warn" id="noStorage" hidden>Storage isn't connected yet, so nothing can be saved. Follow the setup steps in the README to add the <b>DATA</b> KV binding.</div>
    <section id="view"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/js/content.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
